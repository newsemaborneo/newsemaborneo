<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#FF0033" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: monospace; font-weight: bold; }
    .pulse {
      stroke-dasharray: 314.6 1932.6;
      animation: run 5s linear infinite;
    }
    @keyframes run {
      from { stroke-dashoffset: 2247.2; }
      to   { stroke-dashoffset: 0; }
    }
    .dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: beat 0.9s ease-in-out infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(0.8); opacity: 1; }
      50%      { transform: scale(1.6); opacity: 0.4; }
    }
  </style>

