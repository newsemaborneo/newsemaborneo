<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 14" width="800" height="14" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF0033"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="7" x2="800" y2="7" stroke="#2a2a33" stroke-width="2"/>
  <rect x="-240" y="4" width="240" height="6" rx="3" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="x" values="-240;800" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="400" cy="7" r="3" fill="#00F0FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
